name: 问题报告 / Bug report
description: 报告崩溃、查询结果异常、删除失败等问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：应用已被设为**默认短信应用**且已授予短信权限——
        绝大多数"删除失败"都源于这两项。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 点击 ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 见 AppBar 菜单或 Release 标签
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 机型与 Android 版本
      placeholder: "Pixel 7 / Android 15"
    validations:
      required: true
  - type: dropdown
    id: default-app
    attributes:
      label: 本应用是否为默认短信应用
      options:
        - 是
        - 否
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: data-loss
    attributes:
      label: 数据影响
      options:
        - label: 涉及短信丢失（系统短信应用里也查不到了）
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 如有 adb logcat 输出请贴在这里
      render: shell
