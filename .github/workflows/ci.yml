name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 全流程只跑 analyze / test / Kotlin 单测 / debug APK，不涉及发布签名。
# release 签名材料随仓库（android/key.properties + android/app/key/sms.keystore）。
jobs:
  analyze-test-build:
    name: Analyze, Test & Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Kotlin/Robolectric-or-JUnit 原生单测（ChannelCodes / SmsAccess / OnceResult）。
      - name: Android unit tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest

      # --debug 会走 Android 工具链（含 compileDebugKotlin），验证 Kotlin 侧能编过。
      # release 构建依赖签名配置，不在 CI 强制。
      - name: Build debug APK
        run: flutter build apk --debug
