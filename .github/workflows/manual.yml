name: Manual operation

on:
  workflow_dispatch:
    inputs:
      flutter_channel:
        default: "stable"
        required: true
        type: choice
        options:
          - beta
          - master
          - stable
      build_release:
        description: "Build release APK (uses repo signing)"
        default: false
        required: false
        type: boolean

# 防止同一分支的多次手动触发并行执行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          cache: gradle
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Flutter doctor
        run: flutter doctor --verbose

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android unit tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        if: ${{ inputs.build_release }}
        run: |
          mkdir -p android/app/key
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=key/sms.keystore" >> android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key/sms.keystore
          flutter build apk --release

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: sms-${{ inputs.flutter_channel }}
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 7
