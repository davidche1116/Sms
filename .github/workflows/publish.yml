name: Build and publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

# 防止多个 tag 同时构建产生并发发布。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# 使用自动注入的 GITHUB_TOKEN 创建 Release；需 contents: write（默认只读会 403）。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          cache: gradle
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Android unit tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest

      # 签名材料从 CI Secrets 注入（不再随仓库分发）。
      - name: Setup signing key
        run: |
          mkdir -p android/app/key
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=key/sms.keystore" >> android/key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/key/sms.keystore

      - name: Build release APK
        run: flutter build apk --release

      - name: Release APK
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: sms
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 7
