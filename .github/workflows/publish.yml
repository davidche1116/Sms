name: Build and publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

# 防止多个 tag 同时构建产生并发发布。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set Up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "oracle"
          cache: 'gradle'
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK Platform 37
        # compileSdk=37 需要 android-37 目录；sdkmanager 只提供版本化目录（如 android-37.1）。
        # 镜像若已自带有效的 android-37 则跳过，否则取最新已安装的 37.x（排除 beta）做软链。
        # yes 在 sdkmanager 退出后写 stdin 会收 SIGPIPE，在 pipefail 下导致整步失败，用 || true 忽略。
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            LATEST_37=$(ls -d "$ANDROID_HOME/platforms/android-37".* 2>/dev/null | grep -v beta | sort -V | tail -n 1)
            if [ -z "$LATEST_37" ]; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" || true
              LATEST_37="$ANDROID_HOME/platforms/android-37.1"
            fi
            ln -sfnT "$LATEST_37" "$ANDROID_HOME/platforms/android-37"
          fi
          ls "$ANDROID_HOME/platforms"
        shell: bash

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true
        shell: bash

      - name: Install Dependencies
        run: flutter pub get
        shell: bash

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
        shell: bash

      - name: Analyze project source
        run: dart analyze
        shell: bash

      - name: Run widget tests
        run: flutter test
        shell: bash

      - name: Install fastforge
        run: dart pub global activate fastforge
        shell: bash

      - name: Build APK
        run: fastforge release --name apk
        shell: bash

      - name: Release APK
        uses: softprops/action-gh-release@v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/**
            build/symbols/apk/**
          # release 开启了混淆（distribute_options.yaml 的 obfuscate +
          # split-debug-info），符号表不随发布归档的话，线上崩溃栈无法还原。
          draft: true
          token: ${{ secrets.SMS_RELEASE }}

      - name: Archive APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sms
          path: |
            dist/**
          overwrite: true
          compression-level: 9
          retention-days: 2
